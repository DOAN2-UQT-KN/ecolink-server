services:
  # Shared PostGIS instance for all services. Exposed on 5433 to match the
  # DATABASE_URL in every service .env (5432 is left free for any other local
  # Postgres). init-postgis-db.sql creates the 5 service databases and enables
  # the postgis / uuid-ossp extensions on first boot.
  #
  # NOTE: this adopts the container that used to be created by hand. The data
  # lives in the pre-existing (anonymous) volume declared as external below, so
  # compose must never be pointed at a fresh volume or the local data is gone.
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres-ecolink
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgis-db.sql:/docker-entrypoint-initdb.d/init-postgis-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8  # latest is the pro image and needs a license
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d

  # Local-only Datadog Agent. Services run on the host (npm run dev) and send
  # traces/metrics to localhost:8126 / :8125 which are mapped from this container.
  # Start with: DD_API_KEY=<key> docker compose up -d datadog-agent
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    pid: host
    environment:
      DD_API_KEY: "${DD_API_KEY}"
      DD_SITE: "${DD_SITE:-datadoghq.com}"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      # Don't auto-run integration checks against unrelated containers from other
      # projects (e.g. a stray RabbitMQ) so the logs stay quiet locally.
      DD_AC_EXCLUDE: "name:.*rabbitmq.*"
    ports:
      - "8126:8126"
      - "8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

volumes:
  localstack_data:
  # Pre-existing volume from the hand-made postgres-ecolink container; holds the
  # local identitydb/incidentdb/notificationdb/rewarddb/aidb data.
  postgres_data:
    external: true
    name: 53ca2c6c00ef04e3fc99efd51115f4e5c2902962e2f5719baa403bcc76a95011
